<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="../../css/style.css">
        <link rel="stylesheet" href="../../css/settings.css">
        <title>utktanteiroku_sample</title>
    </head>

    <body>
        <div class="base" id="set_base">
            <div id="set_contentdiv" >
                <!--class="top"のdisplayがnoneになっていて、
                素の状態では表示されませんので表示させる場合にはdisplayを変更してください-->
               <div class="set_segment">
                    <div class="setting_item">
                        タイプライタ―演出のスピード
                     </div>
                    <div class="set_button_box">
                        <button class="typewriter" id="typewriter-immediately">
                            なし
                        </button>
                        <button class="typewriter" id="typewriter-fast">
                            はやい
                        </button>
                        <button class="typewriter" id="typewriter-normal">
                            ふつう
                        </button>
                        <button class="typewriter" id="typewriter-slow">
                            ゆっくり
                        </button>
                    </div>
                </div><!--これで一単位-->

                <div class="set_segment">
                    <div class="setting_item">
                        オートモードのスピード
                    </div>
                    <div class="set_button_box">
                        <button class="automode" id="automode-fast">
                            はやい
                        </button>
                        <button class="automode" id="automode-normal">
                            ふつう
                        </button>
                        <button class="automode" id="automode-slow">
                            ゆっくり
                        </button>
                    </div>
                </div><!--これで一単位-->
            </div>
            <button id="set_backbutton" class="backbutton back_content"></button><!--ゲーム画面に戻るボタン-->
        </div>
    </body>
</html>
