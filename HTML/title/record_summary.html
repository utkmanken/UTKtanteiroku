<!DOCTYPE html>
<html>
    <!-- スペースの数はそちらに合わせます。 -->
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="../../css/style.css">
        <link rel="stylesheet" href="../../css/title.css">
        <title>utktanteiroku_sample_title</title>
    </head>
    <body>
        <div class="base logbase" id="log_base">     
            <button id="log_title_button_inSummary" class="backbutton title_back back_content"></button><!--ゲーム画面に戻るボタン-->
            <div id="record_div" class="log_container">
                <!--このdivが右に寄っているのは仕様です-->
                <div id="summary_title_number">
                    n話目
                </div>
                <div class="pictures_div">
                    <div id="pictures_1" class="pictures"></div>
                    <div id="pictures_2" class="pictures"></div>
                    <!--各話ごとに、写真を用意するので、それぞれ読み込んでほしいです-->
                </div>
                <div id="summary_box">
                    ここに要約を書く
                </div>
                <button id="replay_story">
                    <div id="replay_frame">
                    もっと思い出す
                    <!--ここを押した際に、その話のストーリーを再生する-->
                    </div>
                </button>
            </div>
        
    </body>
</html>
