<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="../../css/style.css">
        <link rel="stylesheet" href="../../css/maindisplay.css">
        <title>utktanteiroku_sample</title>
    </head>

    <!--形式上別のhtmlとなっていますが、meindisplayのhtmlにメインメニューが
    　　重ねて表示される形式でお願いします。-->

    <body>
        <div class="base menubase" id="maindisplaybase">
            <div id="contentdiv-inside">
                <button id="backdisplaybutton" class="backbutton display_close"></button><!--ゲーム画面に戻るボタン-->

                <!--class="top"のdisplayがnoneになっていて、
                素の状態では表示されませんので表示させる場合にはdisplayを変更してください-->

                <!--機能追加予定-->
                <div id="menublock">
                    <button id="setting" class="menubotton">
                        <div class="set_item_frame"><!--完全装飾用-->
                        設定
                        </div>
                    </button>
                    <button id="openmap" class="menubotton">
                        <div class="set_item_frame"><!--完全装飾用-->
                        地図を開く
                        </div>
                    </button>
                    <button id="skipbutton" class="menubotton">
                        <div class="set_item_frame"><!--完全装飾用-->
                        スキップ
                        </div>
                    </button>
                    <button id="backtotitle" class="menubotton">
                        <div class="set_item_frame"><!--完全装飾用-->
                        タイトルに戻る
                        </div>
                    </button>
                </div>
            </div><!--タイトル画面の上に表示する用のdiv-->
            <div id="alertdiv-inside" class="top"></div><!--確認画面用のdiv-->
        </div>
    </body>
</html>
